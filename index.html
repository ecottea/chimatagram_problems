<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チマタグラムクイズ</title>
  
  <!-- モダンな日本語フォントを読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #4facfe;
      --primary-hover: #00f2fe;
      --accent-color: #ff758c;
      --accent-hover: #ff7eb3;
      --bg-color: #f0f4f8;
      --text-color: #334155;
      --light-text: #64748b;
      --card-bg: #ffffff;
    }

    body { 
      font-family: 'Noto Sans JP', sans-serif; 
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px; 
      margin: 40px auto; 
      padding: 0 20px; 
      line-height: 1.6;
    }
    
    h2 {
      text-align: center;
      color: var(--text-color);
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    .rule-box { 
      background: #e0f2fe;
      color: #1e293b;
      border-left: 5px solid #0284c7;
      padding: 16px 24px; 
      border-radius: 12px; 
      margin-bottom: 30px; 
      font-size: 0.95em; 
    }

    .rule-box strong {
      background: #bae6fd;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .control-panel { 
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 25px; 
      display: flex; 
      flex-direction: column;
      gap: 15px; 
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 0.9rem;
      color: var(--light-text);
      font-weight: 700;
    }

    select, input { 
      font-family: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px; 
      font-size: 0.95rem;
      color: var(--text-color);
      outline: none;
      transition: all 0.3s ease;
      background-color: #f8fafc;
    }
    
    select:focus, input:focus {
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
    }

    button { 
      font-family: inherit;
      padding: 10px 18px; 
      cursor: pointer; 
      border: none;
      border-radius: 8px;
      font-weight: 700;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    
    button:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: linear-gradient(to right, var(--primary-color), var(--primary-hover));
      color: white;
      box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 15px rgba(79, 172, 254, 0.4);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--light-text);
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-accent {
      background: linear-gradient(to right, var(--accent-color), var(--accent-hover));
      color: white;
      box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
    }
    .btn-accent:hover {
      box-shadow: 0 6px 15px rgba(255, 117, 140, 0.4);
      transform: translateY(-1px);
    }

    .card { 
      background: var(--card-bg); 
      padding: 35px 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 30px; 
      text-align: center;
    }

    .card h3 {
      margin-top: 0;
      color: var(--light-text);
      font-size: 1.1rem;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 25px;
    }

    .question-block {
      margin-bottom: 25px;
    }

    .question-block p {
      margin: 10px 0;
      font-size: 1.05rem;
    }

    .question-block strong {
      color: var(--light-text);
      font-size: 0.85rem;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 問題文を強調するデザイン */
    .q-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 3px;
      margin: 20px 0;
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #f1f5f9;
    }

    .hidden { display: none !important; }
    
    #answerArea { 
      margin-top: 25px; 
      background: #fff5f5; 
      border: 1px solid #fed7d7;
      padding: 20px; 
      border-radius: 12px; 
      animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #answerArea p {
      margin: 12px 0;
      font-size: 1.1rem;
    }

    .ans-highlight {
      color: #e53e3e;
      font-weight: 700;
      font-size: 1.4rem;
      background: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(229, 62, 62, 0.1);
      margin-left: 8px;
    }

    .nav-area {
      text-align: center;
      margin-bottom: 60px;
    }
    
    .btn-large {
      padding: 14px 45px;
      font-size: 1.1rem;
      border-radius: 30px; /* 丸みのあるボタン */
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <h2>✨ チマタグラムクイズ ✨</h2>

  <!-- ルール説明エリア -->
  <div class="rule-box">
    文字を並べ替えて指定されたジャンルの言葉にしてください。<br>
    ただし <strong>余計な文字が1文字</strong> 含まれています。
  </div>

  <div class="control-panel">
    <div class="control-row">
      <label class="control-group">
        ジャンル:
        <select id="genreSelect">
          <option value="data/non_genre.json">ノンジャンル</option>
          <option value="data/pokemon_names.json">ポケモンの名前</option>
          <option value="data/pokemon_moves.json">ポケモンの技</option>
          <option value="data/pokemon_abilities.json">ポケモンの特性</option>
        </select>
      </label>
    </div>
    
    <div class="control-row" style="justify-content: flex-start;">
      <label class="control-group">
        問題番号:
        <input type="number" id="problemInput" min="1" style="width: 70px;">
      </label>
      <button id="goBtn" class="btn-secondary">移動</button>
      <button id="randomBtn" class="btn-accent">🎲 ランダム</button>
    </div>
  </div>

  <div class="card">
    <h3>
      <span id="problemNum">第 1 問</span> 
      <span style="color:#cbd5e1; margin:0 8px;">|</span> 
      <span id="totalNum">全 0 問</span>
    </h3>
    
    <div class="question-block">
      <p><strong>ジャンル</strong> <span id="genreText">読み込み中...</span></p>
      <div class="q-text" id="questionText">読み込み中...</div>
      <p><strong>読み</strong> <span id="readingText">読み込み中...</span></p>
    </div>

    <button id="showAnswerBtn" class="btn-secondary" style="width: 100%; padding: 14px; margin-top: 10px;">
      💡 答えを見る
    </button>

    <div id="answerArea" class="hidden">
      <p><strong>答え</strong> <span id="answerText" class="ans-highlight"></span></p>
      <p><strong>余計な1文字</strong> <span id="extraCharText" class="ans-highlight"></span></p>
    </div>
  </div>

  <div class="nav-area" style="display: flex; justify-content: center; gap: 30px;">
    <button id="prevBtn" class="btn-primary btn-large">⬅ 前の問題へ</button>
    <button id="nextBtn" class="btn-primary btn-large">次の問題へ ➔</button>
  </div>

  <!-- JavaScriptはそのまま維持 -->
  <script>
    const cache = {};
    let currentQuestions = [];
    let currentIndex = 0;
    let currentGenrePath = "";

    async function init() {
      const select = document.getElementById('genreSelect');
      
      select.addEventListener('change', (e) => {
        loadGenre(e.target.value);
      });

      loadGenre(select.value);
    }

    async function loadGenre(filePath) {
      currentGenrePath = filePath;

      if (!cache[filePath]) {
        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error('File not found');
          cache[filePath] = await response.json();
        } catch (e) {
          alert(`データファイル (${filePath}) の読み込みに失敗しました。`);
          clearDisplay();
          return;
        }
      }

      currentQuestions = cache[filePath];
      const totalCount = currentQuestions.length;
      document.getElementById('totalNum').textContent = `全 ${totalCount} 問`;

      if (totalCount === 0) {
        clearDisplay();
        return;
      }

      const savedIndex = localStorage.getItem(`chimatagram_progress_${filePath}`);
      if (savedIndex !== null && parseInt(savedIndex, 10) < totalCount) {
        currentIndex = parseInt(savedIndex, 10);
      } else {
        currentIndex = 0;
      }

      showQuestion(currentIndex);
    }

    function showQuestion(index) {
      if (index < 0 || index >= currentQuestions.length) return;

      currentIndex = index;
      const q = currentQuestions[currentIndex];

      document.getElementById('problemNum').textContent = `第 ${currentIndex + 1} 問`;
      document.getElementById('genreText').textContent = q.genre || '-';
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('readingText').textContent = q.reading;
      
      document.getElementById('answerText').textContent = q.answer || '-';
      document.getElementById('extraCharText').textContent = q.extraChar;

      document.getElementById('answerArea').classList.add('hidden');
      document.getElementById('problemInput').value = currentIndex + 1;
      document.getElementById('problemInput').max = currentQuestions.length;

      localStorage.setItem(`chimatagram_progress_${currentGenrePath}`, currentIndex);
    }

    function clearDisplay() {
      document.getElementById('problemNum').textContent = "第 - 問";
      document.getElementById('totalNum').textContent = "全 0 問";
      document.getElementById('genreText').textContent = "-";
      document.getElementById('questionText').textContent = "-";
      document.getElementById('readingText').textContent = "-";
      document.getElementById('answerArea').classList.add('hidden');
    }

    // イベント設定
    document.getElementById('showAnswerBtn').addEventListener('click', () => {
      document.getElementById('answerArea').classList.remove('hidden');
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex - 1 >= 0) {
        showQuestion(currentIndex - 1);
      } else {
        alert('これが最初の問題です！');
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex + 1 < currentQuestions.length) {
        showQuestion(currentIndex + 1);
      } else {
        alert('このジャンルの問題は以上です！');
      }
    });

    document.getElementById('goBtn').addEventListener('click', () => {
      const inputVal = parseInt(document.getElementById('problemInput').value, 10);
      if (!isNaN(inputVal) && inputVal >= 1 && inputVal <= currentQuestions.length) {
        showQuestion(inputVal - 1);
      } else {
        alert(`1 〜 ${currentQuestions.length} の範囲で指定してください。`);
      }
    });

    // ランダムボタンのイベント処理
    document.getElementById('randomBtn').addEventListener('click', () => {
      if (currentQuestions.length === 0) return;
      if (currentQuestions.length === 1) {
        showQuestion(0);
        return;
      }
      let randomIndex;
      // 直前と同じ問題が連続で選ばれないようにする
      do {
        randomIndex = Math.floor(Math.random() * currentQuestions.length);
      } while (randomIndex === currentIndex);

      showQuestion(randomIndex);
    });

    init();
  </script>
</body>
</html>
